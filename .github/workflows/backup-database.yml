
name: Backup PostgreSQL Render

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Instalar cliente PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Crear respaldo
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          mkdir -p backups
          /usr/lib/postgresql/18/bin/pg_dump \
            --dbname="$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="backups/udemm-global.dump"

      - name: Guardar respaldo en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: udemm-global-backup
          path: backups/udemm-global.dump
          retention-days: 30
          if-no-files-found: error
